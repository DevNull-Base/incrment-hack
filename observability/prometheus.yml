# Сбор метрик приложения. Используется профилем observability в docker compose.
global:
  scrape_interval: 10s
  evaluation_interval: 15s
  external_labels:
    system: rtk-crm

scrape_configs:
  - job_name: 'crm-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['api:3000']
        labels:
          role: api

  # Worker не публикует HTTP-порт, поэтому его метрики собираются
  # через pushgateway либо включением отдельного порта метрик.
  # Оставлено закомментированным до настройки под конкретный стенд.
  # - job_name: 'crm-worker'
  #   static_configs:
  #     - targets: ['worker:9100']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
