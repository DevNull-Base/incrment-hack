# Перекрытие для локальной разработки.
#
# Базовый docker-compose.yml запускает продуктовую конфигурацию: NODE_ENV=production,
# обязательная антивирусная проверка, закрытая документация, вход только через Keycloak.
# Так и надо проверять систему по умолчанию — стенд должен вести себя как рабочий.
#
# Этот файл включается вторым и снимает ровно те ограничения, которые мешают
# быстрым проверкам, — и ничего больше:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile app up -d
#
# Профиль app вместо full: антивирус в этом режиме выключен, контейнер ClamAV
# поднимать незачем.
#
# Значения заданы явно, а не через ${...}: переключение режима не должно зависеть
# от того, что сейчас лежит в .env, — иначе «быстро переключиться» превращается
# в «вспомнить, какие пять переменных поменять обратно».

services:
  api:
    environment:
      # Снимает запреты валидации: обход аутентификации, выключенный антивирус,
      # документация без пароля. В production каждый из них роняет процесс на старте.
      NODE_ENV: development
      # Вход без Keycloak: запросы уходят без Authorization, бэкенд подставляет
      # фиктивного пользователя. Роль меняется здесь же — так проверяется,
      # что видит КАМ, руководитель и администратор.
      AUTH_DEV_BYPASS: 'true'
      AUTH_DEV_BYPASS_ROLE: ${AUTH_DEV_BYPASS_ROLE:-ADMIN}
      # Без ClamAV вложения остаются непроверенными, а непроверенные файлы
      # бэкенд не выдаёт. Для локальных проверок выдачу разрешаем.
      CLAMAV_ENABLED: 'false'
      ALLOW_UNSCANNED_DOWNLOAD: 'true'
      LOG_LEVEL: ${LOG_LEVEL:-debug}

  worker:
    environment:
      NODE_ENV: development
      CLAMAV_ENABLED: 'false'
      ALLOW_UNSCANNED_DOWNLOAD: 'true'
      LOG_LEVEL: ${LOG_LEVEL:-debug}
